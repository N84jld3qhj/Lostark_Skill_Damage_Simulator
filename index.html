<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 Pretendard,"Malgun Gothic",system-ui,sans-serif}
.top{height:54px;background:#151c25;border-bottom:1px solid #26313e;display:flex;align-items:center;justify-content:center;position:sticky;top:0;z-index:5}.topin{width:min(1120px,96%);display:flex;align-items:center;gap:22px}.tools{margin-left:auto;display:flex;gap:8px}.btn{border:1px solid #3a4a5d;background:#26384b;color:#dcecff;padding:7px 11px;border-radius:6px;cursor:pointer}.btn.primary{background:#326ba4;border-color:#3c7dbb}.btn:hover{filter:brightness(1.18)}.wrap{width:min(1120px,96%);margin:24px auto 60px}.hero{display:block;margin:0 0 14px}.profile,.score,.panel,.sidebox{background:var(--panel);border:1px solid var(--line);border-radius:8px}.profile{display:grid;grid-template-columns:145px 1fr;gap:14px;padding:12px}.avatar{height:150px;border-radius:6px;background:radial-gradient(ellipse at 50% 40%,#e65b4b 0,#66313a 42%,#182433 75%);display:flex;align-items:center;justify-content:center;font-size:56px}.pinfo{min-width:0}.tags{display:flex;gap:5px;color:#aebed0;font-size:10px}.tag{padding:2px 5px;border-radius:3px;background:#2c3948}.pname{font-size:18px;font-weight:800;margin:5px 0 10px}.pstats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;border-top:1px solid var(--line);padding-top:9px}.big{font-size:24px;color:#7bbcff;font-weight:800}.metric small{display:block;color:var(--muted);font-size:10px}.metric strong{font-size:13px}.score{padding:12px}.score h3,.panel h3{font-size:13px;margin:0 0 10px}.scoreval{display:flex;justify-content:space-between;margin:9px 0}.scoreval strong{color:#8dc6ff}.tabs{display:flex;gap:0;background:#1b232d;border:1px solid var(--line);border-radius:7px;margin-bottom:14px;overflow:auto}.tabs button{flex:1;white-space:nowrap;background:none;border:0;color:#aebed0;padding:11px 8px;cursor:pointer;border-bottom:2px solid transparent}.tabs button.active{color:#7fc2ff;border-bottom-color:#60b7ff;font-weight:700}.layout{display:block;width:100%}.left,.main{display:flex;flex-direction:column;gap:12px;min-width:0;width:100%}.panel{padding:12px}.muted{color:var(--muted)}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.stat{background:#151d27;border:1px solid #293747;border-radius:5px;padding:7px}.stat span{display:block;color:var(--muted);font-size:10px}.stat b{font-size:14px}.menulist{display:grid;gap:5px}.menulist a{background:#2b5275;color:#d8ecff;padding:6px 9px;border-radius:5px;text-decoration:none;font-size:11px}.twocol{display:flex;flex-direction:column;gap:12px;width:100%}.sectiontitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.sectiontitle h3{margin:0}.count{color:var(--gold);font-size:11px}.gems{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:5px;padding:2px 0;max-width:100%;width:100%;overflow:visible}.gem{background:transparent;border:0;border-radius:0;padding:0 1px;text-align:center;min-width:0;display:flex;flex-direction:column;gap:4px}.gem .field{width:100%;min-width:0;box-sizing:border-box;padding:4px 3px;font-size:10px;height:25px}.gemicon{position:relative;flex:0 0 50px;width:50px;height:50px;max-width:100%;margin:0 auto 1px;border-radius:5px;background:linear-gradient(135deg,#f4c75b,#7b4bc6 50%,#193c8c);border:1px solid #b8a3ff;display:grid;place-items:center;font-size:22px;box-sizing:border-box}.gemicon img{display:block;width:100%;height:100%;object-fit:contain;border-radius:4px}.gemlevel{position:absolute;right:-2px;top:-2px;padding:1px 3px;border-radius:3px;background:#397eae;color:#fff;font-size:10px;font-weight:800;line-height:14px;border:1px solid #b8dfff}.gem strong{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gem small{color:#9db0c4;font-size:9px}.equiplist{display:grid;gap:7px}.equip{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px;background:#151d27;border:1px solid #2d3b4b;border-radius:6px}.equipicon{width:40px;height:40px;border-radius:5px;background:linear-gradient(135deg,#5d7d72,#d5c27c);display:grid;place-items:center;font-size:19px}.equipname{font-weight:700;font-size:11px}.equipmeta{font-size:10px;color:#9fb0c3}.editgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin-top:5px}.field{width:100%;min-width:0;background:#202c39;color:#e6f1fc;border:1px solid #3a4a5a;border-radius:4px;padding:5px;font:11px inherit}.field:focus{outline:1px solid #67b8ff}.engraves{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.engrave{display:flex;gap:8px;align-items:center;background:#151d27;border:1px solid #2c3b4b;border-radius:6px;padding:8px}.engraveicon{width:40px;height:40px;border-radius:7px;background:linear-gradient(135deg,#743d4b,#211b2e);display:grid;place-items:center;font-size:20px}.engrave input{margin-top:4px}.arkpoints{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.point{padding:10px;background:#252b31;border-radius:6px;border:1px solid #3c4854}.point:nth-child(2){background:#1d303a}.point:nth-child(3){background:#29352d}.point b{font-size:18px}.point input{width:100%;margin-top:7px}.cores{display:grid;grid-template-columns:1fr 1fr;gap:8px}.core{background:#151d27;border:1px solid #344152;border-radius:6px;padding:9px}.corehead{display:flex;justify-content:space-between;gap:8px}.coretitle{font-weight:700;color:#e9d29a;font-size:11px}.coreopts{display:grid;gap:4px;margin-top:8px}.opt{background:#202b38;padding:5px 7px;border-radius:4px;font-size:10px;color:#b9c9da}.skills{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.skill{background:#151d27;border:1px solid #2c3b4b;border-radius:5px;padding:7px}.skill b{font-size:11px}.skill small{color:var(--muted)}.row{display:flex;gap:6px;align-items:center}.row>*{flex:1}.subhead{font-size:11px;color:#9bb0c5;margin:12px 0 6px}.hidden{display:none}.footer{color:#718398;text-align:center;padding:20px;font-size:10px}

@media(max-width:560px){.profile{grid-template-columns:90px 1fr}.avatar{height:115px}.pstats{grid-template-columns:1fr 1fr}.cores{grid-template-columns:1fr}.engraves{grid-template-columns:1fr 1fr}.tools .btn{padding:6px}}

#arkgrid{grid-column:1/-1}
.arktoolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:4px 0 12px}
.arkbulk{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.arkbulk select{min-width:112px}
.arkcolumns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.arkfamily{background:#151d27;border:1px solid #304052;border-radius:7px;padding:10px;min-width:0}

.arkcoretitle{font-weight:800;font-size:12px}
.arkpoint{font-weight:900;color:#f3cb75;font-size:17px;white-space:nowrap}
.arkcorecontrols{display:grid;grid-template-columns:1fr 1.4fr;gap:6px;margin-bottom:8px}
.arkgems{display:grid;gap:6px}
.arkgemhead{display:grid;grid-template-columns:70px minmax(0,1fr) 48px 48px 24px;gap:5px;color:#91a1b4;font-size:9px;padding:0 4px}
.arkgem{display:grid;grid-template-columns:70px minmax(0,1fr) 48px 48px 24px;gap:5px;align-items:center;background:#131b25;border:1px solid #2d3d4e;border-radius:5px;padding:6px 4px}

.arkgemopts{display:grid;gap:4px;min-width:0}
.arkgemopt{display:grid;grid-template-columns:minmax(0,1fr) 58px;gap:4px}

.arkgemmetric{font-size:10px;text-align:center}
.arkgemremove{border:0;background:transparent;color:#e28c8c;font-size:17px;cursor:pointer}
.arkhint{font-size:10px;color:#91a1b4;margin:0 0 8px}
.arkoptions{margin-top:8px;padding:7px;background:#151e29;border-radius:5px}

.la-warn{position:fixed;inset:0;z-index:9999;background:rgba(5,9,14,.68);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;animation:lawf .15s ease-out}
.la-warn-box{width:min(380px,100%);background:linear-gradient(180deg,#1c2735,#151f2b);border:1px solid #3a2f26;border-top:3px solid var(--gold);border-radius:12px;padding:24px 22px 18px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.55);animation:law .18s ease-out}
.la-warn-ico{width:42px;height:42px;margin:0 auto 12px;border-radius:50%;background:rgba(255,200,92,.14);border:1px solid rgba(255,200,92,.5);color:var(--gold);font-size:24px;font-weight:800;line-height:40px}

.la-warn-s{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.la-warn-s span{background:rgba(255,200,92,.12);border:1px solid rgba(255,200,92,.4);color:var(--gold);font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
.la-warn-d{font-size:12.5px;line-height:1.6;color:var(--muted);margin-bottom:18px}
.la-warn-b{width:100%;padding:10px;border-radius:8px;border:1px solid #4c7aa8;background:linear-gradient(180deg,#34608a,#2a4d6f);color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.la-warn-b:hover{filter:brightness(1.15)}
@keyframes lawf{from{opacity:0}to{opacity:1}}@keyframes law{from{transform:translateY(8px) scale(.97);opacity:0}to{transform:none;opacity:1}}
</style><style>
.equip-bulk{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;align-items:center;margin:8px 0 12px;padding:8px;background:var(--panel2,#151e2b);border-radius:9px;font-size:11px}
.equip-detail{padding:10px 0;border-bottom:1px solid var(--line,#263244)}.equip-detail-head{display:flex;justify-content:space-between;align-items:center}.equip-detail .editgrid{margin-top:7px}.batch-check{display:flex;gap:5px;align-items:center;font-size:11px;color:var(--muted)}
.avatar-grid{display:grid;grid-template-columns:55px repeat(4,1fr);gap:8px;align-items:center;text-align:center;font-size:11px;padding:8px 0}.avatar-grid label{display:grid;place-items:center}
.option-edit{grid-template-columns:1.5fr .7fr .5fr;margin:5px 0}

.panel.collapsible-panel{padding:0;overflow:hidden}
.panel-toggle{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;padding:12px;background:transparent;border:0;color:inherit;text-align:left;cursor:pointer;font:inherit}
.panel-toggle .sectiontitle{width:100%;margin:0}
.panel-toggle h3{margin:0;font-size:13px}
.panel-toggle .collapse-mark{color:var(--muted);font-size:12px;transition:transform .18s ease}
.panel-content{padding:0 12px 12px}

.panel-toggle:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.inner-collapse{border-top:1px solid var(--line);padding:9px 0}.inner-collapse summary{cursor:pointer;color:#b8c8d9;font-weight:700;font-size:12px}.inner-collapse[open] summary{margin-bottom:8px}
</style>
<style>

.twocol{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}

.lx-icon{position:relative;width:52px;height:52px;border-radius:7px;background:linear-gradient(145deg,#c9a76a,#5b4524);display:grid;place-items:center;font-weight:800;color:#fff;flex:0 0 52px;overflow:hidden}

.lx-switch input:checked+span{background:#2f7fe0}.lx-switch input:checked+span::after{transform:translateX(14px)}

<script>

const _lines=s=>String(s||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);

function parseStatLine(l){

function parseEquip(it,idxByType){

  if(P['연마 효과']) out.polish=_lines(P['연마 효과'].replace(/\s*\/\s*/g,'\n')).map(parseStatLine).filter(Boolean);

  }
  if(it.Type==='어빌리티 스톤'){
    const eng=[]; let bonus=null;

    const cs=grp&&grp.value&&grp.value.Element_000&&grp.value.Element_000.contentStr||{};
    Object.values(cs).forEach(c=>{const t=_strip(c.contentStr); let m=t.match(/^\[(.+?)\]\s*Lv\.(\d+)/); if(m) eng.push({name:m[1],level:+m[2]}); else if((m=t.match(/^\[레벨 보너스\]\s*(.+)/))) bonus=parseStatLine(m[1].trim());});
    out.stone={engravings:eng,levelBonus:bonus,base:P['기본 효과']||null};

}

function parseBraceletEffect(l){
  const v=(re)=>{const m=l.match(re);return m?parseFloat(m[1]):null};
  const val=_num(l);
  let key=null;
  if(/치명타 피해가/.test(l)&&!/적중 시/.test(l)) key='치명타 피해';
  else if(/치명타로 적중 시 적에게 주는 피해/.test(l)) key='치명타 시 적에게 주는 피해';
  else if(/치명타 적중률/.test(l)) key='치명타 적중률';
  else if(/방향성 공격이 아닌 스킬/.test(l)) key='비방향성 스킬 피해';
  else if(/^적에게 주는 피해가/.test(l)) key='적에게 주는 피해';
  else if(/추가 피해/.test(l)) key='추가 피해';

  if(raw.engravings) S.engravings=(raw.engravings.ArkPassiveEffects||raw.engravings.Effects||[]).map(e=>({name:e.Name,level:e.Level,grade:e.Grade,stoneLevel:e.AbilityStoneLevel,desc:_strip(e.Description)}));
  if(raw.arkpassive){
    (raw.arkpassive.Points||[]).forEach(x=>{S.arkPassive.points[x.Name]={value:x.Value,rank:_strip(x.Description)};});
    S.arkPassive.title=raw.arkpassive.Title;
    S.arkPassive.effects=(raw.arkpassive.Effects||[]).map(e=>{const t=_strip(e.Description);const m=t.match(/^(\S+)\s+(\d)티어\s+(.+?)\s+Lv\.(\d+)$/);return m?{tree:m[1],tier:+m[2],name:m[3],level:+m[4],icon:e.Icon||null}:{tree:e.Name,raw:t};});
    const sum={}; S.arkPassive.effects.forEach(e=>{if(e.tier){const k=e.tree;sum[k]=sum[k]||{};sum[k][e.tier]=(sum[k][e.tier]||[]);sum[k][e.tier].push(e);}});
    S.arkPassive.byTree=sum;
  }
  if(raw.gems){

    S.gems=(raw.gems.Gems||[]).map(g=>{
      const T=tipParts(g.Tooltip); const eff=(T.texts.concat(Object.values(T.parts))).join('\n');
      const m=eff.match(/\[(.+?)\]\s*(.+?)\s+(피해|재사용 대기시간)\s*([\d.]+)%\s*(증가|감소)/);

      const opts=[]; _strip(P['코어 옵션']||'').split(/\n/).forEach(l=>{const m=l.match(/^\[(\d+)P\]\s*(.+)/); if(m) opts.push({p:+m[1],text:m[2].trim()}); else if(opts.length&&l.trim()) opts[opts.length-1].text+=' '+l.trim();});
      const gems=(c.Gems||[]).map(g=>{
        const GT=tipParts(g.Tooltip), gp=GT.parts, info=gp['젬 기본 정보']||'', eff=gp['젬 효과']||'';
        const effs=[]; const re=/\[(.+?)\]\s*Lv\.(\d+)\s*\n?\s*\1\s*\+?([\d.]+)%/g; let m;
        const flat=eff.replace(/\n/g,' ');

<script>
(function (root) {
  const GR = ['하', '중', '상'];

  const FLAT = [{ n: '무기 공격력', u: '', v: { 하: 195, 중: 480, 상: 960 } }, { n: '공격력', u: '', v: { 하: 80, 중: 195, 상: 390 } }];
  const ACC = {

    '귀걸이': [{ n: '공격력', u: '%', v: { 하: 0.4, 중: 0.95, 상: 1.55 } }, { n: '무기 공격력', u: '%', v: { 하: 0.8, 중: 1.8, 상: 3 } }, ...FLAT],
    '반지': [{ n: '치명타 적중률', u: '%', v: { 하: 0.4, 중: 0.95, 상: 1.55 } }, { n: '치명타 피해', u: '%', v: { 하: 1.1, 중: 2.4, 상: 4 } }, ...FLAT]
  };

  const GEM_RATE = { '공격력': 0.44 / 12, '추가 피해': 0.97 / 12, '보스 피해': 1 / 12 };
  const trunc2 = v => Math.floor(v * 100 + 1e-9) / 100;

  function accOpt(slotName, o) {
    if (!o) return { opt: '없음', grade: '하' };
    const base = slotName.replace(/\s*\d+$/, '');
    for (const c of ACC[base] || []) {
      if (c.n !== o.name || c.u !== (o.unit || '')) continue;
      for (const g of GR) if (Math.abs(c.v[g] - Number(o.val)) < 1e-4) return { opt: c.n + (c.u ? ' %' : ''), grade: g };

  }

    const gems = { atk: trunc2((sum['공격력'] || 0) * GEM_RATE['공격력']), addDmg: trunc2((sum['추가 피해'] || 0) * GEM_RATE['추가 피해']), bossDmg: trunc2((sum['보스 피해'] || 0) * GEM_RATE['보스 피해']) };

        statList.forEach(item => {
            if (!item) return;
            if (Array.isArray(item.effects)) item.effects.forEach(eff => cb(eff, item));
            else if (item.category || item.type || (withFormula && item.formula)) cb(item, item);
        });
    }

    function hasTagCondition(eff) {
        return (eff.targetTags && eff.targetTags.length > 0) ||
               (eff.requireTags && eff.requireTags.length > 0) ||
               (eff.excludeTags && eff.excludeTags.length > 0) ||
               (eff.excludeSkillTags && eff.excludeSkillTags.length > 0);
    }

    function collectTagModifiers(inputs, env) {
        const list = [];
        forEachBaseEffect(env.statList, (eff, item) => addTagModifier(list, item.name, eff));
        collectOrderCoreTagModifiers(list, inputs, env);
        return list;
    }

    function addBaseStats(commonStats, env) {
        forEachBaseEffect(env.statList, (eff, item) => {
            const cat = eff.category || eff.type;
            if (cat === "태그 추가" || cat === "태그 제거") return;
            if (!hasTagCondition(eff) && !eff.formula) {
                addStat(commonStats, cat, item.name, eff.val ?? eff.value, eff.unit);
            }
        });
    }

    const ESTHER_BONDING1 = [145983, 153282, 257503, 453359];
    const ESTHER_BONDING2 = [3946, 4305, 7250, 16450];
    const VAMBRACE_GRADE_ATK_PERCENT = { "영웅": 0, "전설": 1, "유물": 2, "고대": 3 };

    function addEquipmentStats(commonStats, inputs, env) {

        addStat(commonStats, "주스탯", "투구", inputs.headStat, "");
        addStat(commonStats, "주스탯", "견갑", inputs.shoulderStat, "");
        addStat(commonStats, "주스탯", "상의", inputs.topStat, "");
        addStat(commonStats, "주스탯", "하의", inputs.bottomStat, "");
        addStat(commonStats, "주스탯", "장갑", inputs.gloveStat, "");

        const weaponLabel = inputs.isEsther ? `에스더 무기 (엘라 ${inputs.estherElla ?? 0})` : "무기";
        addStat(commonStats, "무기 공격력", weaponLabel, inputs.weaponAtk, "");

        if (inputs.isEsther) {
            const ellaLvl = inputs.estherElla ?? 0;
            if (env.estherBonding1) {
                const stat = ESTHER_BONDING1[ellaLvl] || 0;

            }
            if (env.estherBonding2) {
                const stat = ESTHER_BONDING2[ellaLvl] || 0;

            }
        }

        if (inputs.vambraceData) {
            const weaponAtk = inputs.vambraceData.무기공격력 || 0;

            if (mainStat > 0) addStat(commonStats, "주스탯", "완갑", mainStat, "");

            const baseAtk = inputs.vambraceData.기본공격력 || 0;
            if (baseAtk > 0) addStat(commonStats, "기본 공격력", "완갑", baseAtk, "");
        }

        const vambraceNormalAtkPercent = VAMBRACE_GRADE_ATK_PERCENT[inputs.vambraceGrade || "영웅"] ?? 0;
        if (vambraceNormalAtkPercent > 0) {
            addStat(commonStats, "기본 공격력 %", "완갑 기본 공격력 %", vambraceNormalAtkPercent, "%");
        }
    }

    function addArkPassiveStats(commonStats, inputs) {

        const evolutionData = inputs?.arkPassive?.["진화"] || inputs?.arkPassive?.evolution;
        const evolutionRank = (typeof evolutionData === "object" && evolutionData !== null)
            ? Number(evolutionData.rank) || 0
            : Number(inputs?.arkPassive?.evolutionRank) || 0;

        if (evolutionRank > 0) {
            const statValue = Number((evolutionRank * 1).toFixed(2));
            addStat(commonStats, "진화형 피해", `아크 패시브 진화 (Rank.${evolutionRank})`, statValue, "%");
        }

        const enlightenData = inputs?.arkPassive?.["깨달음"] || inputs?.arkPassive?.enlighten;
        let enlightenLevel = 0;
        if (typeof enlightenData === "object" && enlightenData !== null) {
            enlightenLevel = Number(enlightenData.level) || 0;
        } else if (Array.isArray(enlightenData)) {
            const atkNode = enlightenData.find(node => node.name && (node.name.includes("무기 공격력") || node.name.includes("깨달음")));
            enlightenLevel = Number(atkNode?.level) || 0;
        } else {
            enlightenLevel = Number(inputs?.arkPassive?.enlightenLevel) || 0;
        }

        if (enlightenLevel > 0) {
            const statValue = Number((enlightenLevel * 0.1).toFixed(2));
            addStat(commonStats, "무기 공격력 %", `아크 패시브 깨달음 (Lv.${enlightenLevel})`, statValue, "%");
        }
    }

    const PERCENT_STAT_LIST = ["공격력 %", "무기 공격력 %", "치명타 피해", "치명타 적중률", "피해 증가", "추가 피해", "적에게 주는 피해"];

    function matchAccessoryKey(rawKey) {
        const keys = Object.keys(accessoryTable);
        let matchedKey = keys.find(k => k.trim() === rawKey);
        if (matchedKey) return matchedKey;

        if (rawKey.includes("아군 공격력") || rawKey.includes("아공강")) return keys.find(k => k.includes("아군 공격력")) || "아군 공격력 강화 효과 %";
        if (rawKey.includes("아군 피해") || rawKey.includes("아피강")) return keys.find(k => k.includes("아군 피해")) || "아군 피해 강화 효과 %";
        if (rawKey.includes("낙인력")) return keys.find(k => k.includes("낙인력")) || "낙인력 %";
        if (rawKey.includes("무기 공격력") && rawKey.includes("%")) return "무기 공격력 %";
        if (rawKey.includes("무기 공격력")) return "무기 공격력";
        if (rawKey.includes("공격력") && rawKey.includes("%")) return "공격력 %";
        if (rawKey.includes("공격력")) return "공격력";
        if (rawKey.includes("치명타 적중률") || rawKey.includes("치적")) return "치명타 적중률";
        if (rawKey.includes("치명타 피해") || rawKey.includes("치피")) return "치명타 피해";
        if (rawKey.includes("추가 피해") || rawKey.includes("추피")) return "추가 피해";
        if (rawKey.includes("적에게 주는 피해") || rawKey.includes("적주피")) return "적에게 주는 피해";
        return undefined;
    }

    function addAccessoryStats(commonStats, inputs) {
        inputs.accessories.forEach(acc => {
            addStat(commonStats, "주스탯", acc.name, acc.statValue, "");
            acc.slots.forEach((slot, idx) => {
                if (!slot || !slot.opt || slot.opt === "none" || slot.opt === "없음") return;

                const matchedKey = matchAccessoryKey(slot.opt.trim());
                if (matchedKey && accessoryTable[matchedKey]?.[slot.grade] !== undefined) {
                    const val = accessoryTable[matchedKey][slot.grade];
                    const isPercent = matchedKey.includes("%") || PERCENT_STAT_LIST.includes(matchedKey);
                    addStat(commonStats, matchedKey, `장신구: ${acc.name} (슬롯${idx + 1}) [${matchedKey} - ${slot.grade}]`, val, isPercent ? "%" : "");
                }
            });
        });
    }

    function addGemStats(commonStats, inputs) {
        addStat(commonStats, "공격력 %", "젬: 공격력", inputs.gems.atk);
        addStat(commonStats, "추가 피해", "젬: 추가 피해", inputs.gems.addDmg);
        addStat(commonStats, "적에게 주는 피해", "젬: 보스 피해", inputs.gems.bossDmg);

        const skillGemMap = {};
        inputs.skillGems.forEach(gem => {
            const gemAtkVal = gemDataTable["공증"]?.[gem.level] || 0;
            if (gemAtkVal > 0) {
                addStat(commonStats, "기본 공격력 %", `보석(${gem.type}): ${gem.skillName} [${gem.level}레벨]`, parseFloat(gemAtkVal.toFixed(2)));
            }
            if (!skillGemMap[gem.skillName]) skillGemMap[gem.skillName] = [];
            skillGemMap[gem.skillName].push({ type: gem.type, level: gem.level });
        });
        return skillGemMap;
    }

    function addBraceletStats(commonStats, inputs) {
        [['crit', '치명'], ['swift', '신속'], ['spec', '특화'], ['mainStat', '주스탯']].forEach(([key, category]) => {
            const val = inputs.bracelet?.[key];
            if (val) addStat(commonStats, category, "팔찌", val, "");
        });

        const braceletSkillEffects = [];
        (inputs?.bracelet?.options || []).forEach((opt, i) => {
            if (!opt || !opt.opt || opt.opt === "none") return;

            const optionEffects = getBraceletOptionData(opt.opt, opt.grade);
            if (optionEffects.length === 0) {
                ;
                return;
            }

            const source = `팔찌 옵션 ${i + 1} (${opt.opt} - ${opt.grade})`;
            optionEffects.forEach(eff => {
                if (!eff.requireTags || eff.requireTags.length === 0) {
                    addStat(commonStats, eff.category, source, eff.val);
                } else {
                    braceletSkillEffects.push({ source, category: eff.category, val: eff.val, unit: eff.unit, requireTags: eff.requireTags });
                }
            });
        });
        return braceletSkillEffects;
    }

    function buildCommonStats(inputs, env) {
        const commonStats = createEmptyStats();

        const partyCritBonus = env.partyCritCount * STAT_CONSTANTS.PARTY_CRIT_SYNERGY_PER_PLAYER;
        if (partyCritBonus > 0) {
            addStat(commonStats, "치명타 적중률", `파티 시너지 (${env.partyCritCount}명)`, partyCritBonus);
        }

        addBaseStats(commonStats, env);
        addEquipmentStats(commonStats, inputs, env);
        addArkPassiveStats(commonStats, inputs);
        addAccessoryStats(commonStats, inputs);
        const skillGemMap = addGemStats(commonStats, inputs);
        const braceletSkillEffects = addBraceletStats(commonStats, inputs);

        return { commonStats, skillGemMap, braceletSkillEffects };
    }

    const MAX_TAG_PASSES = 10;

    function resolveSkillTags(skillData, env, tagModifiers) {
        const { name: skillName, tags: baseTags = [], tripods: currentTripods = [] } = skillData;
        const tagSet = new Set(baseTags);

        const selectedForThisSkill = env.selectedTripods[skillName] || env.selectedTripods[skillData.id] || {};
        const selectedNames = Object.values(selectedForThisSkill);

        if (Array.isArray(currentTripods)) {
            currentTripods.forEach(tp => {
                if (!selectedNames.includes(tp.name)) return;
                const effects = Array.isArray(tp.effects) ? tp.effects : [tp];
                effects.forEach(eff => {
                    if ((eff.category === "태그 추가" || eff.type === "태그 추가") && eff.val) tagSet.add(eff.val.trim());
                    if ((eff.category === "태그 제거" || eff.type === "태그 제거") && eff.val) tagSet.delete(eff.val.trim());
                });
            });
        }

        for (let pass = 0; pass < MAX_TAG_PASSES; pass++) {
            let changed = false;
            tagModifiers.forEach(mod => {
                const ctx = { tags: Array.from(tagSet), name: skillName };
                if (!matchTags(ctx, { require: mod.requireTags, exclude: mod.excludeTags }, { all: true })) return;
                if (mod.action === "ADD" && !tagSet.has(mod.targetTag)) { tagSet.add(mod.targetTag); changed = true; }
                else if (mod.action === "REMOVE" && tagSet.has(mod.targetTag)) { tagSet.delete(mod.targetTag); changed = true; }
            });
            if (!changed) break;
        }

        return { skillTags: Array.from(tagSet), selectedNames };
    }

    function applyBraceletSkillEffects(stats, braceletSkillEffects, ctx) {
        braceletSkillEffects.forEach(effect => {
            if (matchTags(ctx, { require: effect.requireTags }, { all: true, reqName: false })) {
                addStat(stats, effect.category, effect.source, effect.val);
            }
        });
    }

    function applyConditionalBaseStats(stats, env, ctx) {
        const pendingFormulas = [];

        forEachBaseEffect(env.statList, (eff, item) => {
            const exTags = eff.excludeTags || eff.excludeSkillTags || [];
            const reqTags = eff.targetTags || eff.requireTags || eff.requireSkillTags || [];
            if (!matchTags(ctx, { require: reqTags, exclude: exTags })) return;

            const formulaStr = eff.formula || item.formula;
            if (formulaStr) {
                pendingFormulas.push({
                    category: eff.category || eff.type || item.category || item.type,
                    name: item.name,
                    formula: formulaStr,
                    unit: eff.unit ?? item.unit ?? "%"
                });
            } else {
                const val = eff.val ?? eff.value ?? item.val ?? item.value;
                if (val !== undefined && (reqTags.length > 0 || exTags.length > 0)) {
                    addStat(stats, eff.category || eff.type, item.name, val, eff.unit ?? "%");
                }
            }
        }, true);

        return pendingFormulas;
    }

    function applyTripodStats(stats, skillData, selectedNames, ctx) {
        const currentTripods = skillData.tripods || [];
        if (!Array.isArray(currentTripods)) return;

        currentTripods.forEach(tp => {
            if (!selectedNames.includes(tp.name)) return;

            const exTags = tp.excludeTags || tp.excludeSkillTags || [];
            const reqTags = tp.requireTags || tp.requireSkillTags || (tp.requiredTag ? [tp.requiredTag] : []);
            if (!matchTags(ctx, { require: reqTags, exclude: exTags }, { exName: false })) return;

            const sourceType = `트라이포드(${tp.tier ? tp.tier + '트포 - ' : ''}${tp.name})`;
            const processEffect = (eff) => {
                if (eff.category !== "태그 추가" && eff.category !== "태그 제거" && eff.type !== "태그 추가" && eff.type !== "태그 제거") {
                    addStat(stats, eff.category || eff.type, sourceType, eff.val, eff.unit ?? "%");
                }
            };

            if (Array.isArray(tp.effects)) tp.effects.forEach(processEffect);
            else if (tp.category && tp.val !== undefined) processEffect(tp);
        });
    }

    function applyEngravingStats(stats, inputs, ctx) {
        inputs.engravings.forEach(eng => {
            if (!eng || eng.name === "none" || eng.level === "미사용") return;

            const engData = engravingTable[eng.name];
            if (!engData) return;

            const exTags = engData.excludeTags || engData.excludeSkillTags || [];
            const reqTags = engData.requireTags || engData.requireSkillTags || [];
            if (!matchTags(ctx, { require: reqTags, exclude: exTags }, { exName: false, reqName: false })) return;

            const levelEffects = engData.levels?.[eng.level] || [];
            const stoneEffects = engData.stone?.[eng.stone] || [];

            if (eng.name === "돌격대장") {
                const raidFactor = (levelEffects[0]?.val || 0) + (stoneEffects[0]?.val || 0);
                if (raidFactor > 0) {
                    stats["_돌격대장계수"] = raidFactor / 100;
                    stats["_돌격대장정보"] = `각인: 돌격대장 [${eng.level} + 세공 ${eng.stone}]`;
                }
                return;
            }

            levelEffects.forEach(eff => {
                const matchingStone = stoneEffects.find(s => s.type === eff.type);
                const stoneVal = matchingStone ? (Number(matchingStone.val) || 0) : 0;
                const totalVal = parseFloat(((Number(eff.val) || 0) + stoneVal).toFixed(2));
                addStat(stats, eff.type, `각인: ${eng.name} [${eng.level} + 세공 ${eng.stone}]`, totalVal, eff.unit || "%");
            });
        });
    }

    function applySkillGemStats(stats, skillGemMap, skillName) {
        (skillGemMap[skillName] || []).forEach(({ type, level }) => {
            if (type === "겁화") {
                addStat(stats, "적에게 주는 피해", `보석(겁화): ${skillName} [${level}레벨]`, parseFloat(((gemDataTable["겁화"][level] - 1) * 100).toFixed(2)));
            } else if (type === "작열") {
                addStat(stats, "쿨타임 감소", `보석(작열): ${skillName} [${level}레벨]`, parseFloat(((1 - gemDataTable["작열"][level]) * 100).toFixed(2)));
            }
        });
    }

    function applyArkEvolutionStats(stats, arkStats, ctx) {
        if (!arkStats || typeof arkStats !== 'object') return;

        for (const cat in arkStats) {
            if (!Array.isArray(arkStats[cat])) continue;
            arkStats[cat].forEach(eff => {
                const exTags = eff.excludeTags || eff.excludeSkillTags || [];
                const reqTags = eff.requireTags || eff.requireSkillTags || [];
                if (!matchTags(ctx, { require: reqTags, exclude: exTags }, { exName: false, reqName: false })) return;
                addStat(stats, cat, eff.source, eff.val, eff.unit);
            });
        }
    }

    function computeAttack(stats, inputs) {
        const totalStoneLevel = Array.isArray(inputs.engravings)
            ? inputs.engravings.reduce((sum, eng) => sum + (parseInt(eng?.stone, 10) || 0), 0)
            : 0;
        const carveAtkBonusPercent = totalStoneLevel >= 5 ? 1.5 : 0;

        const finalStat = getStatSum(stats, "주스탯") * (1 + getStatSum(stats, "주스탯 %") / 100);
        const weaponAtkPercent = getStatSum(stats, "무기 공격력 %");
        const finalWeaponAtk = getStatSum(stats, "무기 공격력") * (1 + (weaponAtkPercent / 100));
        const normalAtkPercent = getStatSum(stats, "기본 공격력 %");

        const calculatedBaseAtk = finalStat > 0 && finalWeaponAtk > 0
            ? (Math.sqrt((finalStat * finalWeaponAtk) / 6)) * (1 + (normalAtkPercent + carveAtkBonusPercent) / 100)
            : 0;

        const flatAtkBonus = getStatSum(stats, "공격력");
        const percentAtkBonus = getStatSum(stats, "공격력 %");
        const finalAtk = (calculatedBaseAtk + flatAtkBonus) * (1 + (percentAtkBonus / 100));

        return { totalStoneLevel, carveAtkBonusPercent, finalStat, weaponAtkPercent, finalWeaponAtk, normalAtkPercent, calculatedBaseAtk, finalAtk };
    }

    function computeSpeed(stats) {
        const totalSwift = getStatSum(stats, "신속");
        const swiftSpeedBonus = totalSwift * STAT_CONSTANTS.SWIFT_TO_SPEED;
        return {
            totalSwift,
            finalAtkSpeed: swiftSpeedBonus + getStatSum(stats, "공격 속도"),
            finalMoveSpeed: swiftSpeedBonus + getStatSum(stats, "이동 속도")
        };
    }

    const formulaCache = new Map();
    function evaluatePendingFormulas(stats, pendingFormulas, formulaContext) {
        const keys = Object.keys(formulaContext);
        const values = Object.values(formulaContext);

        pendingFormulas.forEach(item => {
            try {
                let fn = formulaCache.get(item.formula);
                if (!fn) {
                    fn = new Function(...keys, `return ${item.formula};`);
                    formulaCache.set(item.formula, fn);
                }
                const calcVal = fn(...values);
                if (typeof calcVal === 'number' && !isNaN(calcVal)) {
                    addStat(stats, item.category, item.name, parseFloat(calcVal.toFixed(2)), item.unit);
                }
            } catch (err) {
                ;
            }
        });
    }

    function applyTier5Stats(stats, tier5, d) {
        let totalBluntDmg = 0, totalSonicDmg = 0, capCritRate = false;
        const { bluntThornNode, sonicsNode, MpFurnaceNode } = tier5;

        if (bluntThornNode && bluntThornNode.current > 0) {
            const excessCrit = Math.max(0, (d.totalCritRatePercent / 100 - 0.8) * 100);
            const lv = bluntThornNode.current;
            const baseDmg = lv === 1 ? 7.5 : 15.0;
            const ratio   = lv === 1 ? 1.25 : 1.5;
            const maxDmg  = lv === 1 ? 52.5 : 75.0;

            totalBluntDmg = Math.min(maxDmg, baseDmg + (excessCrit * ratio));
            capCritRate = true;
            addStat(stats, "진화형 피해", `아크 패시브(진화 5티어): 뭉툭한 가시 [${lv}/${bluntThornNode.max}LV]`, parseFloat(totalBluntDmg.toFixed(2)));
        }

        if (stats["_돌격대장계수"]) {
            const moveSpeedBonus = Math.min(STAT_CONSTANTS.SPEED_CAP, Math.max(0, d.finalMoveSpeed));
            addStat(stats, "적에게 주는 피해", `${stats["_돌격대장정보"]} (이속 +${moveSpeedBonus.toFixed(2)}% 적용)`, parseFloat((moveSpeedBonus * stats["_돌격대장계수"]).toFixed(2)));
        }

        if (sonicsNode && sonicsNode.current > 0) {
            const CAP = STAT_CONSTANTS.SPEED_CAP;
            const atkBonus = Math.max(0, d.finalAtkSpeed);
            const moveBonus = Math.max(0, d.finalMoveSpeed);
            let sonicDmg = (Math.min(CAP, atkBonus) + Math.min(CAP, moveBonus)) * 0.1;
            sonicDmg += (Math.max(0, atkBonus - CAP) + Math.max(0, moveBonus - CAP)) * 0.3;
            if (atkBonus > CAP && moveBonus > CAP) sonicDmg += 8;
            if (sonicsNode.current === 1) sonicDmg *= 0.5;
            totalSonicDmg = Math.min(STAT_CONSTANTS.SONICS_MAX_DMG, sonicDmg);
            addStat(stats, "진화형 피해", `아크 패시브(진화 5티어): 음속 돌파 [${sonicsNode.current}/${sonicsNode.max}LV]`, parseFloat(totalSonicDmg.toFixed(2)));
        }

        if (MpFurnaceNode && MpFurnaceNode.current > 0) {
            let furnaceDmg = Math.min(24, d.mana * 0.05);
            if (MpFurnaceNode.current === 1) furnaceDmg *= 0.5;
            if (furnaceDmg > 0) {
                addStat(stats, "진화형 피해", `아크 패시브(진화 5티어): 마나 용광로 [${MpFurnaceNode.current}/${MpFurnaceNode.max}LV]`, parseFloat(furnaceDmg.toFixed(2)));
            }
        }

        return { totalBluntDmg, totalSonicDmg, capCritRate };
    }

    function applySpecializationStats(stats, specDB, ctx) {
        const specStatValue = getStatSum(stats, "특화");
        if (!(specStatValue > 0) || !specDB) return;

        const getSpecItems = (db) => {
            if (!db || typeof db !== 'object') return [];
            if (Array.isArray(db.targetTags)) return [db];
            if (Array.isArray(db)) return db.flatMap(getSpecItems);
            return Object.values(db).flatMap(getSpecItems);
        };

        let totalSpecCoeff = 0;
        getSpecItems(specDB).forEach(item => {

        const stats = commonRes.stats || {};

        let vambracePercentList = [...(stats["기본 공격력 %"] || [])];

        bodyContent += `
            <details data-sec-key="sec2" ${sec2Open} style="margin-bottom: 20px;">

                        <div style="text-align: right; font-weight: bold; color: #e2e8f0; margin-top: 10px; font-size: 0.95rem; border-top: 1px dashed #2e323d; padding-top: 8px;">

                    </div>

                    
                    <div style="background: #181920; border: 1px solid #2e323d; padding: 14px; border-radius: 8px;">
                        <div style="font-weight: 600; color: #c084fc; margin-bottom: 8px; font-size: 0.95rem;">1. 최종 무기 공격력</div>
                        ${formatItemListToTable(stats["무기 공격력"], stats["무기 공격력 %"] || stats["무기 공격력%"], { flat: "[무기 공격력 합산]", percent: "[무기 공격력 % 계수]" })}
                        <div style="text-align: right; font-weight: bold; color: #e2e8f0; margin-top: 10px; font-size: 0.95rem; border-top: 1px dashed #2e323d; padding-top: 8px;">
                            합계 = <span style="color: #38bdf8; font-size: 1.05rem;">${Math.floor(finalWeaponAtk).toLocaleString()}</span>
                        </div>
                    </div>

                    
                    <div style="background: #181920; border: 1px solid #2e323d; padding: 14px; border-radius: 8px;">
                        <div style="font-weight: 600; color: #c084fc; margin-bottom: 8px; font-size: 0.95rem;">2. 기본 공격력</div>
                        <div style="background: #0f1015; padding: 8px 12px; border-radius: 6px; border: 1px solid #222634; margin-bottom: 8px; font-size: 0.82rem; color: #cbd5e1;">
                            💡 <strong>공식:</strong> ( √(주스탯 ${Math.floor(finalStat).toLocaleString()} × 최종무공 ${Math.floor(finalWeaponAtk).toLocaleString()}) / 6 )*계수
                        </div>
                        ${formatItemListToTable(stats["기본 공격력"], vambracePercentList, { flat: "[기본 공격력 합산]", percent: "[기본 공격력 % 계수]" })}
                        <div style="text-align: right; font-weight: bold; color: #e2e8f0; margin-top: 10px; font-size: 0.95rem; border-top: 1px dashed #2e323d; padding-top: 8px;">
                            합계 = <span style="color: #38bdf8; font-size: 1.05rem;">${Math.floor(calculatedBaseAtk).toLocaleString()}</span>
                        </div>
                    </div>

                    
                    <div style="background: #181920; border: 1px solid #2e323d; padding: 14px; border-radius: 8px;">
                        <div style="font-weight: 600; color: #c084fc; margin-bottom: 8px; font-size: 0.95rem;">3. 최종 공격력</div>
                        ${formatItemListToTable(stats["공격력"], stats["공격력 %"], { flat: "[공격력 합산]", percent: "[공격력 % 계수]" })}
                        <div style="text-align: right; font-weight: bold; color: #facc15; margin-top: 10px; font-size: 1.1rem; border-top: 1px dashed #2e323d; padding-top: 8px;">
                            최종 공격력 = ${Math.floor(finalAtk).toLocaleString()}

                </div>
            </details>
        `;

        const selectedResult = allSkillResults[currentIdx] || allSkillResults[0];
        const sec3Open = window.sectionOpenStates.sec3 ? 'open' : '';
        const sec3Arrow = window.sectionOpenStates.sec3 ? '▼' : '▲';

        bodyContent += `
            <details data-sec-key="sec3" ${sec3Open} style="margin-bottom: 10px;">
                <summary style="${sectionHeaderStyle}">
                    <span>🎯 [3. 선택 스킬] <span style="color: #facc15;">${selectedResult.skillName}</span> 상세 세팅 내역</span>
                    <span class="toggle-icon" style="font-size: 0.8rem; color: #94a3b8;">${sec3Arrow}</span>
                </summary>
                <div style="padding-top: 16px;">
                    <div style="background: #181920; border: 1px solid #2e323d; padding: 16px; border-radius: 8px;">
        `;

        if (selectedResult.stats) {
            Object.keys(selectedResult.stats).forEach(cat => {
                if (cat.startsWith('_')) return;

                let items = selectedResult.stats[cat];

                bodyContent += `

                    bodyContent += `<table style="width: 100%; border-collapse: collapse; font-size: 0.82rem;"><tbody>`;

                    items.forEach(item => {

            if (row) { const clickIdx = Number(row.getAttribute('data-idx')); if (!isNaN(clickIdx)) window.renderResultsHTML(window.lastSkillResults, clickIdx); }

    function renderArkPassiveUIInner() {
        const container = document.getElementById('evo-body');
        if (!container) return;

        container.innerHTML = '';

        const sectionHeaderStyle = makeSectionHeaderStyle('#c084fc');

        const details = document.createElement('details');
        details.style.marginBottom = '20px';
        details.setAttribute('open', '');

        const arrow = window.isArkPassiveOpen ? '▼' : '▲';
        details.innerHTML = `
            <summary style="${sectionHeaderStyle}">
                <span>✨ [아크 패시브 - 진화] 세팅</span>
                <span class="toggle-icon" style="font-size: 0.8rem; color: #94a3b8;">${arrow}</span>
            </summary>
        `;

        details.ontoggle = function() {
            window.isArkPassiveOpen = this.open;
            const icon = this.querySelector('.toggle-icon');
            if (icon) {
                icon.textContent = this.open ? '▼' : '▲';
            }
        };

        const contentDiv = document.createElement('div');
        contentDiv.style.cssText = `
            padding-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 30px; /* 행 간의 세로 간격을 넓혀줍니다 */
        `;

        CTX.nodes().forEach((row, rowIndex) => {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'ark-row';
            const maxRowLimit = CTX.limits[rowIndex];

            row.forEach((node) => {
                const nodeDiv = document.createElement('div');
                nodeDiv.className = 'ark-node';

                const currentRowTotal = row.reduce((sum, n) => sum + n.current, 0);
                nodeDiv.title = `${node.name} (현재: ${node.current}/${node.max} | 라인 합계: ${currentRowTotal}/${maxRowLimit})`;

                const isGrayscale = node.current === 0 ? 'grayscale' : '';

                nodeDiv.innerHTML = `
                    <span style="font-size: 11px; margin-bottom: 4px; color: #c9d1d9;">${node.name}</span>
                    <img src="https://cdn-lostark.game.onstove.com/efui_iconatlas/ark_passive_evolution/ark_passive_evolution_${node.id}.png" class="ark-icon ${isGrayscale}" alt="${node.name}" width="40" height="40">
                    <div class="node-controls">
                        <button type="button" class="btn-node btn-dec">-</button>
                        <span style="min-width: 36px; text-align: center; color: #58a6ff;">${node.current}/${node.max}</span>
                        <button type="button" class="btn-node btn-inc">+</button>
                    </div>
                `;

                const changeValue = (delta) => {
                    let targetValue = node.current + delta;
                    if (targetValue < 0) targetValue = 0;
                    if (targetValue > node.max) targetValue = node.max;

                    const otherNodesSum = row.reduce((sum, n) => (n === node ? sum : sum + n.current), 0);
                    if (otherNodesSum + targetValue > maxRowLimit) {
                        targetValue = maxRowLimit - otherNodesSum;
                        if (targetValue < 0) targetValue = 0;
                        if (targetValue > node.max) targetValue = node.max;
                    }

                    if (node.current !== targetValue) {
                        node.current = targetValue;
                        renderArkPassiveUI();
                    }
                };

                const decBtn = nodeDiv.querySelector('.btn-dec');
                const incBtn = nodeDiv.querySelector('.btn-inc');
                const iconImg = nodeDiv.querySelector('.ark-icon');

                const handleNodeChange = (delta, e) => {
                    e.stopPropagation();
                    changeValue(delta);
                    CTX.onEvoChange(rowIndex, node);
                };

                decBtn.onclick = (e) => handleNodeChange(e.shiftKey ? -10 : -1, e);
                incBtn.onclick = (e) => handleNodeChange(e.shiftKey ? 10 : 1, e);
                iconImg.onclick = (e) => handleNodeChange(e.shiftKey ? 10 : 1, e);
                iconImg.oncontextmenu = (e) => {
                    e.preventDefault();
                    handleNodeChange(e.shiftKey ? -10 : -1, e);
                };

                rowDiv.appendChild(nodeDiv);
            });

            contentDiv.appendChild(rowDiv);
        });

        details.appendChild(contentDiv);
        container.appendChild(details);
    }

window.renderArkPassiveUI = renderArkPassiveUIInner;
})();
</script>
<script>
const INITIAL={"meta":{},"stats":{},"equipment":[],"arkPoints":{},"engravings":[],"gems":[],"arkPassive":{"points":{},"effects":[]},"arkGrid":{"cores":[],"effects":[]},"skills":[],"warnings":[],"derived":{},"gemTotals":{}};
let state=structuredClone(INITIAL);
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n??0).toLocaleString('ko-KR');
function field(value,attrs=''){return `<input class="field" value="${esc(value??'')}" ${attrs}>`;}
function select(value,opts,attrs=''){return `<select class="field" ${attrs}>${opts.map(x=>`<option ${String(x)===String(value)?'selected':''}>${esc(x)}</option>`).join('')}</select>`;}
function bindInputs(root,handler){root.querySelectorAll('[data-path]').forEach(el=>{el.addEventListener('change',()=>{const raw=el.dataset.path;if(raw.endsWith('.__coreName')){const path=raw.split('.');const i=Number(path[2]);const c=state.arkGrid.cores[i];c.name=(i<3?'질서':'혼돈')+'의 '+['해','달','별'][i%3]+' 코어 : '+el.value;}else{const path=raw.split('.');let obj=state;for(let i=0;i<path.length-1;i++)obj=obj[path[i]];obj[path.at(-1)]=(el.type==='number'||el.dataset.num)?Number(el.value):el.type==='checkbox'?el.checked:el.value;if(path.includes('bracelet')&&path[path.length-3]==='stats'){const st=state.equipment[Number(path[1])].bracelet.stats;const cap=['치명','신속','특화'];if(path.at(-1)==='val'&&cap.includes(obj.name)&&obj.val>120)obj.val=120;if(path.at(-1)==='val'&&obj.val<0)obj.val=0;if(path.at(-1)==='name'&&cap.includes(obj.name)&&obj.val>120)obj.val=120;}if(path.at(-1)==='tier'&&el.value==='에스더'&&path[0]==='equipment'&&state.equipment[Number(path[1])].slot==='무기'){obj.ella=3;obj.normalLevel=ellaMax(3);}}render();});});}

const normB=s=>String(s||'').replace(/[\s()]/g,'').replace(/(\d+)\.0(?!\d)/g,'$1');
function bangleDerive(br){
 const rest0=normB((br.effects||[]).map(e=>e.text).join(''));
 let rest=rest0;const slots=[];
 while(rest&&slots.length<4){
  let best=null;
  for(const c of BANGLE_CATALOG)for(const g of GR){const v=normB(c.g[g].v);if(rest.startsWith(v)&&(!best||v.length>best.len))best={row:c.row,grade:g,len:v.length};}
  if(!best)break;slots.push({row:best.row,grade:best.grade});rest=rest.slice(best.len);
 }
 while(slots.length<4)slots.push({row:'없음',grade:''});
 return slots;
}
function bangleSync(br){

}

function setupCollapsiblePanels(){

  const toggle=document.createElement('button');
  toggle.type='button';toggle.className='panel-toggle';toggle.setAttribute('aria-expanded','true');
  if(heading.classList.contains('sectiontitle')) toggle.appendChild(heading);
  else {const titleWrap=document.createElement('div');titleWrap.className='sectiontitle';titleWrap.appendChild(heading);toggle.appendChild(titleWrap);}
  const mark=document.createElement('span');mark.className='collapse-mark';mark.textContent='▾';toggle.appendChild(mark);
  const content=document.createElement('div');content.className='panel-content';
  while(panel.firstChild) content.appendChild(panel.firstChild);
  panel.append(toggle,content);panel.classList.add('collapsible-panel');
  toggle.addEventListener('click',()=>{const collapsed=panel.classList.toggle('collapsed');toggle.setAttribute('aria-expanded',String(!collapsed));});
 });
}

<script>
(function () {
  const $q = (s, r = document) => r.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const norm = s => String(s == null ? '' : s).replace(/\s+/g, '');
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { } }
  };
  const jget = (k, def) => { try { return JSON.parse(store.get(k) || 'null') ?? def; } catch (e) { return def; } };
  const f0 = n => Math.round(n).toLocaleString('ko-KR');
  const f2 = n => (Math.round(n * 100) / 100).toLocaleString('ko-KR');
  const sgn = p => (p > 0 ? '+' : '') + p.toFixed(1) + '%';
  const sgn2 = p => (p > 0 ? '+' : '') + p.toFixed(2) + '%';

  function toast(msg, bad) {
    let t = $q('#la-toast'); if (!t) { t = document.createElement('div'); t.id = 'la-toast'; document.body.appendChild(t); }
    t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
    clearTimeout(toast._t); toast._t = setTimeout(() => { t.className = ''; }, 2600);
  }

  function openModal(id, title, html, width) {
    const old = document.getElementById(id); if (old) old.remove();
    const ov = document.createElement('div'); ov.id = id; ov.className = 'la-modal';
    ov.innerHTML = `<div class="la-mbox" style="width:${width || 460}px"><div class="la-mhead"><h3>${title}</h3><button type="button" class="la-mx" aria-label="닫기">&times;</button></div><div class="la-mbody">${html}</div></div>`;
    document.body.appendChild(ov);
    const close = () => ov.remove();
    ov.querySelector('.la-mx').onclick = close;
    ov.addEventListener('mousedown', e => { if (e.target === ov) close(); });
    return { el: ov, body: ov.querySelector('.la-mbody'), close };
  }
  function download(name, obj) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' }));
    a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 500);
  }

  const DATA_KEYS = ['game', 'skills', 'addStat', 'spec', 'cores'];
  const DATA_LABEL = { game: '게임 데이터', skills: '스킬', addStat: '고정 효과', spec: '특화', cores: '질서 코어' };
  const DATA_REQ = { game: true, skills: true, spec: true, addStat: false, cores: false };
  const DATA_HINT = {
    game: '장비/보석/각인/진화 노드 등 표 (gemDataTable, evolutionNodes …)', skills: '스킬 DB 배열 (constant, coefficient, tripods …)',
    addStat: '깨달음/도약 등 고정 효과 배열 (effects …)', spec: '특화 계수 ({coefficient, targetTags})', cores: '질서 코어 파일 (여러 개 가능)'
  };
  let DATA = {};
  DATA_KEYS.forEach(k => { const v = jget('la_d_' + k, null); if (v != null) DATA[k] = v; });
  { const old = jget('la_data_override', null); if (old) DATA_KEYS.forEach(k => { if (DATA[k] == null && old[k] != null) DATA[k] = old[k]; }); }
  function saveData(k) {
    if (DATA[k] == null) { store.del('la_d_' + k); return true; }
    const ok = store.set('la_d_' + k, JSON.stringify(DATA[k]));
    if (!ok) toast(DATA_LABEL[k] + ' 데이터가 커서 브라우저에 저장하지 못했습니다. 새로고침하면 다시 불러와야 합니다.', true);
    return ok;
  }

  const normCache = new WeakMap();
  function normalizeGame(g) {
    if (!g || !g.gemDataTable) return g;
    if (normCache.has(g)) return normCache.get(g);
    const out = Object.assign({}, g), t = {};
    Object.entries(g.gemDataTable).forEach(([kind, row]) => {
      const nr = {}, icons = Object.assign({}, (row && typeof row.icon === 'object' && row.icon) || {});
      Object.entries(row || {}).forEach(([k, v]) => {
        if (k === 'icon') { if (typeof v === 'string') nr.icon = v; return; }
        if (Array.isArray(v)) { nr[k] = v[0]; if (v[1]) icons[k] = v[1]; } else nr[k] = v;
      });
      if (Object.keys(icons).length) nr.icon = icons;
      t[kind] = nr;
    });
    out.gemDataTable = t; normCache.set(g, out); return out;
  }
  const D = () => ({ game: normalizeGame(DATA.game), skills: Array.isArray(DATA.skills) ? DATA.skills : [], addStat: Array.isArray(DATA.addStat) ? DATA.addStat : [], spec: DATA.spec || {}, cores: DATA.cores || {} });
  const missing = () => DATA_KEYS.filter(k => DATA_REQ[k] && (DATA[k] == null || (k === 'skills' && !DATA[k].length)));
  const ready = () => missing().length === 0;
  const hasGame = () => !!(DATA.game && DATA.game.evolutionNodes);
  const noDataHtml = () => `<div class="la-nodata"><b>계산에 필요한 데이터가 아직 없습니다.</b><span>누락: ${missing().map(k => DATA_LABEL[k]).join(', ')}</span>
    <button class="btn primary" type="button" data-act="open-data">📂 데이터 불러오기</button></div>`;

  let engine = null, engineGameRef = null;
  function getEngine() {
    const g = D().game;
    if (!engine || engineGameRef !== g) { engine = LAEngine.createEngine(g); engineGameRef = g; }
    return engine;
  }

  window.laEvoIcon = name => { const g = D().game; if (!g || !g.evolutionNodes) return null; for (const row of g.evolutionNodes) for (const n of row) if (n.name === name && n.id != null) return 'https://cdn-lostark.game.onstove.com/efui_iconatlas/ark_passive_evolution/ark_passive_evolution_' + n.id + '.png'; return null; };
  window.laIcon = {
    gem(kind, level) {
      const g = D().game; if (!g) return null;
      const t = g.gemDataTable || {}, ic = t[kind] && t[kind].icon;
      if (!ic) return null; return typeof ic === 'string' ? ic : (ic[String(level)] || ic.default || null);
    },
    engraving(name) { const g = D().game; const e = g && (g.engravingTable || {})[name]; return (e && e.icon) || null; }
  };

  const FLAGS = Object.assign({ party: 0, est1: false, est2: false, multi: false }, jget('la_flags', {}));
  const saveFlags = () => store.set('la_flags', JSON.stringify(FLAGS));
  let paused = false;

  const EVO_TIER_POINTS = [40, 30, 20, 20, 30], EVO_LEVEL_COST = [1, 10, 10, 10, 15];
  const evoKey = (t, n) => t + '|' + n;
  function ensureEvo(force) {
    if (!state.evo || force) {
      state.evo = {};
      ((state.arkPassive && state.arkPassive.effects) || []).filter(e => e.tree === '진화').forEach(e => { state.evo[evoKey(e.tier, e.name)] = Number(e.level) || 0; });
    }
    return state.evo;
  }

  function deriveTripodSel() {
    const dbBy = {}; D().skills.forEach(s => dbBy[norm(s.name)] = s);
    const out = {};
    (state.skills || []).forEach(s => {
      const j = dbBy[norm(s.name)]; if (!j) return;
      (s.tripods || []).forEach(t => {
        const m = (j.tripods || []).find(x => norm(x.name) === norm(t.name)); if (!m) return;
        const o = out[j.name] = out[j.name] || {};
        let key = String(m.tier), n = 1; while (o[key] != null) key = m.tier + '#' + (++n);
        o[key] = m.name;
      });
    });
    return out;
  }
  function ensureTripodSel(force) { if (!state.tripodSel || force) state.tripodSel = deriveTripodSel(); return state.tripodSel; }

  function buildRun() {
    if (!ready()) throw new Error('NODATA');
    const d = D(), E = getEngine(), G = d.game;
    const evo = ensureEvo();
    G.evolutionNodes.forEach((row, ri) => row.forEach(n => { n.current = Number(evo[evoKey(ri + 1, n.name)]) || 0; }));

    const dbBy = {}; d.skills.forEach(s => dbBy[norm(s.name)] = s);
    const unmatchedSkills = [], ignoredTripods = [];
    (state.skills || []).forEach(s => {
      const j = dbBy[norm(s.name)];
      if (!j) { unmatchedSkills.push({ name: s.name, level: s.level }); return; }
      (s.tripods || []).forEach(t => { if (!(j.tripods || []).some(x => norm(x.name) === norm(t.name))) ignoredTripods.push({ skill: s.name, tripod: t.name }); });
    });
    const sel = {};
    Object.entries(ensureTripodSel()).forEach(([k, v]) => { const j = dbBy[norm(k)]; if (j && v && Object.keys(v).length) sel[j.name] = Object.assign({}, v); });

    const ex = LAAdapter.apiStateToExtracted(state);
    const inputs = E.transformToInputs(E.mapExtractedDataToInputs(ex));
    inputs.selectedTripods = sel;
    const noAv = i => !/아바타/.test(i && i.name || '');
    const baseNames = new Set((G.DEFAULT_ADD_STAT_BASE || []).map(i => i.name));
    const statList = [...(G.DEFAULT_ADD_STAT_BASE || []).filter(noAv), ...(d.addStat || []).filter(i => i && i.name && !baseNames.has(i.name) && noAv(i))];

    const AV = { hero: 1, legend: 2 }, avs = state.avatars || { weapon: 'legend', head: 'legend', top: 'legend', bottom: 'legend' };
    const avKeys = ['weapon', 'head', 'top', 'bottom'];
    const avPct = avKeys.reduce((a, k) => a + (AV[avs[k]] || 0), 0);
    if (avPct > 0) {
      const nL = avKeys.filter(k => avs[k] === 'legend').length, nH = avKeys.filter(k => avs[k] === 'hero').length;
      statList.push({ name: '아바타 (' + [nL ? '전설 ' + nL : '', nH ? '영웅 ' + nH : ''].filter(Boolean).join(' · ') + ')', effects: [{ category: '주스탯 %', val: avPct, unit: '%' }] });
    }
    const env = E.makeEnv({ addStatBase: statList, specializationDatabase: d.spec, orderDataSets: LAEngine.parseOrderDataSets(d.cores), selectedTripods: sel,
      partyCritCount: FLAGS.party, multiCrit: FLAGS.multi, estherBonding1: FLAGS.est1, estherBonding2: FLAGS.est2 });
    const res = E.calculate(inputs, env, d.skills);
    return { res, unmatchedSkills, ignoredTripods, ex, inputs, calc: () => E.calculate(inputs, env, d.skills) };
  }

  function classify(json) {
    if (Array.isArray(json)) {
      if (json.length && json[0] && 'constant' in json[0] && 'coefficient' in json[0]) return 'skills';
      if (json.length && json[0] && Array.isArray(json[0].effects)) return 'addStat';
      return null;
    }
    if (json && typeof json === 'object') {
      if ('gemDataTable' in json || 'evolutionNodes' in json) return 'game';
      if ('coefficient' in json && 'targetTags' in json) return 'spec';
      if (json.specializationDatabase) return 'spec';
      const vals = Object.values(json);
      if (vals.length && vals.every(v => v && typeof v === 'object' && ('type' in v || Object.keys(v).some(k => /고대|유물|전설|영웅/.test(k))))) return 'cores';
    }
    return null;
  }

  const HIST = { undo: [], redo: [], cur: null, t: 0, busy: false };

  function histBtns() {

  }
  function histReset() { HIST.undo = []; HIST.redo = []; HIST.cur = snap(); HIST.t = 0; histBtns(); }
  function trackChange() {
    if (HIST.busy || HIST.cur == null) return;
    const s = snap(); if (s === HIST.cur) return;
    const now = Date.now();
    if (!(now - HIST.t < 350 && HIST.undo.length)) { HIST.undo.push(HIST.cur); if (HIST.undo.length > 100) HIST.undo.shift(); }
    HIST.t = now; HIST.cur = s; HIST.redo = []; histBtns();
  }
  function restoreSnap(s) {
    HIST.busy = true;
    try { state = JSON.parse(s); HIST.cur = s; HIST.t = 0; render(); renderEvo(); renderSkillSim(); }
    finally { HIST.busy = false; }
    scheduleCalc(); histBtns();
  }
  function undo() { trackChange(); if (!HIST.undo.length) { toast('되돌릴 작업이 없습니다.'); return; } HIST.redo.push(HIST.cur); restoreSnap(HIST.undo.pop()); toast('실행 취소'); }
  function redo() { if (!HIST.redo.length) { toast('다시 실행할 작업이 없습니다.'); return; } HIST.undo.push(HIST.cur); restoreSnap(HIST.redo.pop()); toast('다시 실행'); }

  const MAX_CHARS = 15;

  function saveChar(S) {
    const name = S && S.meta && S.meta.name; if (!name) return;
    const idx = charIndex(), payload = JSON.stringify({ savedAt: Date.now(), state: S });
    const put = () => store.set('la_char_' + name, payload);
    idx[name] = Date.now();
    let names = Object.keys(idx).sort((a, b) => idx[a] - idx[b]);
    while (names.length > MAX_CHARS) { const old = names.shift(); delete idx[old]; store.del('la_char_' + old); }
    let ok = put();
    while (!ok && names.length > 1) { const old = names.shift(); if (old === name) continue; delete idx[old]; store.del('la_char_' + old); ok = put(); }
    if (!ok) { delete idx[name]; toast('캐릭터 데이터를 브라우저에 저장하지 못했습니다(용량 부족).', true); }

      <div class="cc-wfoot"><span>합계 <b id="cc-wsum">0%</b></span><span>기타(자동) <b id="cc-woth">100%</b></span>

      <div id="cc-wres" class="cc-wres"></div></div></details>`;
    box.querySelector('details').ontoggle = function () { weightOpen = this.open; };
    box.querySelector('#cc-wbasis').onchange = e => { basis = e.target.value; persist(); weightResult(); };
    box.querySelectorAll('input[data-skill]').forEach(i => i.oninput = () => { let v = parseFloat(i.value); if (!isFinite(v) || v < 0) v = 0; if (v > 100) v = 100; if (v === 0) delete weights[i.dataset.skill]; else weights[i.dataset.skill] = v; persist(); weightResult(); });
    box.querySelectorAll('input[data-cdr]').forEach(i => i.oninput = () => { const v = parseFloat(i.value); if (!isFinite(v) || v <= 0) delete cdRatio[i.dataset.cdr]; else cdRatio[i.dataset.cdr] = Math.min(Math.max(v, 5), 100); persist(); weightResult(); });
    weightResult();
  }

  let optCancel = false, optLast = null, optMode = 'real', optShow = 10, optRunning = false;
  function renderOptBody() {
    const box = $q('#opt-body'); if (!box) return;
    if (!hasGame()) { box.innerHTML = noDataHtml(); return; }
    const G = D().game;
    const nodesHtml = G.evolutionNodes.map((row, ri) => row.filter(n => (n.effects && n.effects.length) || n.isBluntThorn || n.isSonics || n.isMPFurnace)
      .map(n => `<label class="la-chk"><input type="checkbox" data-ex="${esc(n.name)}" ${excluded.has(n.name) ? 'checked' : ''}>${ri + 1}티어 ${esc(n.name)}</label>`).join('')).join('');
    box.innerHTML = `<div class="la-row"><select id="opt-time" class="field" style="max-width:150px"><option value="6000">빠르게 (6초)</option><option value="12000" selected>보통 (12초)</option><option value="30000">정밀 (30초)</option></select>
      <button class="btn primary" id="opt-go" type="button">${optRunning ? '취소' : '최적 진화 조합 찾기'}</button><span id="opt-prog" class="muted"></span></div>
      <details class="la-data"><summary>탐색에서 제외할 노드 (${excluded.size})</summary><div class="la-chks">${nodesHtml}</div></details>
      <div id="opt-res"></div>`;
    box.querySelectorAll('[data-ex]').forEach(c => c.onchange = () => { c.checked ? excluded.add(c.dataset.ex) : excluded.delete(c.dataset.ex); persist(); });
    $q('#opt-go').onclick = runOpt;
    renderOptResults();
  }
  async function runOpt() {
    if (optRunning) { optCancel = true; return; }
    if (!ready()) { toast('먼저 데이터를 불러오세요.', true); return; }
    if (!lastRun) runCalc();
    optRunning = true; optCancel = false; $q('#opt-go').textContent = '취소';
    const evoBefore = JSON.stringify(state.evo);
    try {
      const run = buildRun();
      const O = LAOpt.createOptimizer({ nodes: D().game.evolutionNodes, calc: run.calc, weights, cdRatio, excluded });
      const t = Number($q('#opt-time').value) || 12000;
      const r = await O.run({ timeBudgetMs: t, topN: 100, isCancelled: () => optCancel, onProgress: p => { const el = $q('#opt-prog'); if (el) el.textContent = `${p.modeLabel} 탐색 중… ${p.pct.toFixed(0)}% · ${p.evals.toLocaleString()}회 평가`; } });
      optLast = { r, O, usedW: r.usedUserWeights, usedCd: r.usedCdRatio };
    } catch (e) { $q('#opt-res').innerHTML = `<div class="la-err">${esc(e.message)}</div>`; }
    optRunning = false; optCancel = false;
    if (JSON.stringify(state.evo) !== evoBefore) state.evo = JSON.parse(evoBefore);
    renderOptBody(); scheduleCalc();
  }
  let optSel = null;
  function optSkillGain(x) {
    const v = Number(cdRatio[x.name]), u = (isFinite(v) && v > 0) ? Math.min(Math.max(v, 5), 100) / 100 : 1;
    return (LAOpt.modeRatio(optMode, x.baseDmg, x.currDmg, x.baseCd, x.currCd, u) - 1) * 100;
  }
  function optChartHtml(list, idx, O, r) {
    if (!list.length) return '';
    const top = list.slice(0, 15), sel = list.find(x => x.key === optSel) || list[0];
    const maxG = Math.max(0.01, ...top.map(i => Math.abs(i.gains[idx])));
    const bars = top.map((it, n) => { const g = it.gains[idx];
      return `<div class="oc-r ${it.key === sel.key ? 'on' : ''}" data-sel="${esc(it.key)}" title="클릭하면 스킬별 변화를 봅니다"><span class="oc-n">${n + 1}</span><div class="oc-t"><i class="${g >= 0 ? 'up' : 'dn'}" style="width:${Math.max(1.5, Math.abs(g) / maxG * 100)}%"></i></div><b class="${g >= 0 ? 'pos' : 'neg'}">${sgn(g)}</b></div>`; }).join('');
    const spread = top.length > 1 ? top[0].gains[idx] - top[top.length - 1].gains[idx] : 0;
    const gaps = top.length > 1 ? `1위와 ${top.length}위의 차이는 ${spread.toFixed(2)}%p입니다.` : '';
    const rows = (sel.rows || []).map(x => ({ name: x.name, g: optSkillGain(x) }));
    const maxS = Math.max(0.01, ...rows.map(x => Math.abs(x.g)));
    const sk = rows.map(x => { const w = Math.abs(x.g) / maxS * 50, wt = weights[x.name];
      return `<div class="oc-s"><span class="oc-sn">${esc(x.name)}${wt ? ` <small>${wt}%</small>` : ''}</span><div class="oc-d"><i class="${x.g >= 0 ? 'up' : 'dn'}" style="left:${x.g >= 0 ? 50 : 50 - w}%;width:${Math.max(0.6, w)}%"></i></div><b class="${x.g >= 0 ? 'pos' : 'neg'}">${sgn(x.g)}</b></div>`; }).join('');
    const rank = list.indexOf(sel) + 1;
    return `<div class="oc-wrap"><div class="oc-box"><div class="oc-h">상위 조합 비교 <small>${LAOpt.EVO_MODES[idx].label} · 현재 대비</small></div>${bars}<div class="oc-note">${gaps}</div></div>
      <div class="oc-box"><div class="oc-h">${rank}위 조합 · 스킬별 변화 <small>${LAOpt.EVO_MODES[idx].label}</small></div>${sk}
      <div class="oc-desc">${O.describe(sel.state, r.tiers).map(esc).join('<br>')}</div></div></div>`;
  }
  function renderOptResults() {
    const el = $q('#opt-res'); if (!el || !optLast) return;
    const { r, O } = optLast, idx = EVO_MODE_KEYS.indexOf(optMode), list = r.lists[optMode];
    const note = (optLast.usedW ? '입력한 스킬 비중 기준' : '현재 DPS 비율을 비중으로 사용') + (optLast.usedCd ? ' · 쿨타임 비율 반영' : '');
    el.innerHTML = `<div class="la-tabs2">${EVO_MODE_KEYS.map((k, i) => `<button class="btn ${k === optMode ? 'primary' : ''}" data-m="${k}" type="button">${LAOpt.EVO_MODES[i].label}</button>`).join('')}</div>
      <div class="muted">${note} · 현재 세팅 대비 변화율 · ${r.evals.toLocaleString()}개 조합 평가${r.cancelled ? ' (중단됨)' : ''}</div>${(r.warnings || []).map(w => `<div class="bad">${esc(w)}</div>`).join('')}
      ${optChartHtml(list, idx, O, r)}
      ${list.slice(0, optShow).map((it, n) => `<details class="la-opt"><summary><b>${n + 1}위</b> <span class="${it.gains[idx] >= 0 ? 'pos' : 'neg'}">${sgn(it.gains[idx])}</span> <button class="btn" data-apply="${esc(it.key)}" type="button">적용</button></summary>
        <div class="la-optd">${O.describe(it.state, r.tiers).map(esc).join('<br>')}
        <table class="la-tbl"><thead><tr><th>스킬</th><th>1회 딜</th><th>쿨타임</th><th>DPS</th></tr></thead><tbody>${(it.rows || []).map(x => `<tr><td>${esc(x.name)}</td><td class="n">${sgn(x.dmgPct)}</td><td class="n">${sgn(x.cdPct)}</td><td class="n">${sgn(x.dpsPct)}</td></tr>`).join('')}</tbody></table></div></details>`).join('')}
      ${list.length > optShow ? '<button class="btn" id="opt-more" type="button">더 보기</button>' : ''}`;
    el.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { optMode = b.dataset.m; renderOptResults(); });
    el.querySelectorAll('[data-sel]').forEach(b => b.onclick = () => { optSel = b.dataset.sel; renderOptResults(); });
    const more = $q('#opt-more'); if (more) more.onclick = () => { optShow += 10; renderOptResults(); };
    el.querySelectorAll('[data-apply]').forEach(b => b.onclick = ev => {
      ev.preventDefault(); const it = list.find(x => x.key === b.dataset.apply); if (!it) return;
      const lv = O.levelsOf(it.state, r.tiers);
      D().game.evolutionNodes.forEach((row, ri) => row.forEach((n, j) => { state.evo[evoKey(ri + 1, n.name)] = lv[ri][j]; }));
      renderEvo(); scheduleCalc();
    });
  }

  const BK_APP = 'lostark-sim-backup';
  function bkLocalKeys() { const ks = []; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && /^la_/.test(k) && k !== 'la_key') ks.push(k); } } catch (e) { } return ks.sort(); }
  function bkSummary(items) {
    const ks = Object.keys(items), cnt = re => ks.filter(k => re.test(k)).length;
    const arr = k => { try { const v = JSON.parse(items[k]); return Array.isArray(v) ? v.length : Object.keys(v || {}).length; } catch (e) { return 0; } };
    const parts = [];
    const dk = ks.filter(k => /^la_d_/.test(k)).length; if (dk) parts.push('데이터 ' + dk + '종');
    const ch = cnt(/^la_char_/); if (ch) parts.push('저장 캐릭터 ' + ch + '개');
    if (items.la_baselines) parts.push('비교군 ' + arr('la_baselines') + '개');
    if (items.la_db_presets) parts.push('DB 프리셋 ' + arr('la_db_presets') + '개');
    if (items.la_evo_presets) parts.push('아크패시브 세팅 ' + arr('la_evo_presets') + '개');
    parts.push('전체 항목 ' + ks.length + '개');
    return parts.join(' · ');
  }
  function bkExport() {
    const items = {}; bkLocalKeys().forEach(k => { const v = store.get(k); if (v !== null) items[k] = v; });
    if (!Object.keys(items).length) { toast('백업할 저장 항목이 없습니다.', true); return; }
    const d = new Date(), pad = n => String(n).padStart(2, '0');
    download('lostark-sim-backup-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes()) + '.json', { app: BK_APP, version: 1, savedAt: d.toISOString(), items });
    toast('백업 파일을 저장했습니다. (' + bkSummary(items) + ')');
  }
  function bkApply(items) {
    let n = 0;
    Object.keys(items).forEach(k => {
      if (!/^la_/.test(k) || k === 'la_key' || typeof items[k] !== 'string') return;
      let v = items[k];
      if (k === 'la_chars') {
        try { const cur = JSON.parse(store.get(k) || '{}') || {}, inc = JSON.parse(v) || {}; v = JSON.stringify(Object.assign({}, cur, inc)); } catch (e) { }
      }
      if (store.set(k, v)) n++;
    });
    return n;
  }
  function openBackupModal() {
    const m = openModal('la-bk', '💾 설정 백업', `
      <div class="muted" style="font-size:12px;line-height:1.6;margin-bottom:10px">이 브라우저에 저장된 데이터 JSON, 저장 캐릭터, 비교군, 스킬 딜비중 가중치, 프리셋, 화면 설정을 파일 하나로 저장하고 복원합니다. <b>API 키는 백업에 포함되지 않습니다.</b></div>
      <div class="muted" id="bk-now" style="font-size:12px;margin-bottom:12px"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn primary" id="bk-exp">⬇ 백업 파일 저장</button><button type="button" class="btn" id="bk-imp">⬆ 백업 파일 불러오기</button></div>
      <input type="file" id="bk-file" accept=".json,application/json" hidden>
      <div id="bk-prev" style="margin-top:12px"></div>`, 520);
    const cur = {}; bkLocalKeys().forEach(k => { const v = store.get(k); if (v !== null) cur[k] = v; });
    m.el.querySelector('#bk-now').textContent = '현재 저장됨: ' + (Object.keys(cur).length ? bkSummary(cur) : '없음');
    m.el.querySelector('#bk-exp').onclick = bkExport;
    const fi = m.el.querySelector('#bk-file');
    m.el.querySelector('#bk-imp').onclick = () => { fi.value = ''; fi.click(); };
    fi.onchange = async () => {
      const f = fi.files && fi.files[0]; if (!f) return;
      const pv = m.el.querySelector('#bk-prev');
      try {
        if (f.size > 30 * 1024 * 1024) throw new Error('파일이 너무 큽니다.');
        const j = JSON.parse(await f.text());
        if (!j || j.app !== BK_APP || !j.items || typeof j.items !== 'object') throw new Error('이 시뮬레이터의 백업 파일이 아닙니다.');
        const items = {}; Object.keys(j.items).forEach(k => { if (/^la_/.test(k) && k !== 'la_key' && typeof j.items[k] === 'string') items[k] = j.items[k]; });
        if (!Object.keys(items).length) throw new Error('복원할 항목이 없습니다.');
        pv.innerHTML = `<div style="border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#111b27;font-size:12px;line-height:1.6"><b>${esc(f.name)}</b><br>${esc(bkSummary(items))}<br><span class="muted">같은 이름의 항목은 백업 내용으로 덮어쓰고, 백업에 없는 항목은 그대로 둡니다. 적용 후 페이지가 새로고침됩니다.</span><div style="margin-top:8px"><button type="button" class="btn primary" id="bk-go">이 백업 적용</button></div></div>`;
        pv.querySelector('#bk-go').onclick = () => { const n = bkApply(items); toast(n + '개 항목을 복원했습니다. 새로고침합니다…'); setTimeout(() => location.reload(), 700); };
      } catch (e) { pv.innerHTML = ''; toast('불러오기 실패: ' + (e.message || e), true); }
    };
  }

  let miniObs = null;
  function updateMini() {
    let mini = $q('#sim-mini-modal');
    const grid = $q('#result-body details div[style*="grid"]');
    if (!grid || !lastRun) { if (mini) { mini.classList.remove('show'); mini.innerHTML = ''; } return; }
    if (!mini) { mini = document.createElement('div'); mini.id = 'sim-mini-modal'; document.body.appendChild(mini); }
    mini.innerHTML = `<div class="mini-title">⚡ 캐릭터 공통 세팅 지표 (실시간)</div><div class="mini-metrics-wrapper">${grid.outerHTML}</div>`;
    if (!miniObs && 'IntersectionObserver' in window) {
      const target = $q('#result-panel');
      if (target) {
        miniObs = new IntersectionObserver(es => es.forEach(e => { const m = $q('#sim-mini-modal'); if (m && m.innerHTML) m.classList.toggle('show', !e.isIntersecting); }), { threshold: 0.1 });
        miniObs.observe(target);
      }
    }
  }

    syncCp();
  }
  function syncCp() {
    const cp = $q('#la-cp'); if (!cp) return;
    const eq = (lastRun && lastRun.ex && lastRun.ex.equipment) || {};
    const isEsther = !!(eq.isEsther || (typeof eq.weaponTier === 'string' && eq.weaponTier.includes('에스더')));
    const setTg = (btn, on, label) => { btn.textContent = (on ? '⚡ ' : '💤 ') + label + ' : ' + (on ? 'ON' : 'OFF'); btn.classList.toggle('on', !!on); };
    const e1 = cp.querySelector('[data-tg="est1"]'), e2 = cp.querySelector('[data-tg="est2"]');
    if (!isEsther && (FLAGS.est1 || FLAGS.est2) && lastRun) { FLAGS.est1 = FLAGS.est2 = false; saveFlags(); }
    setTg(e1, FLAGS.est1, '결속 1단계'); setTg(e2, FLAGS.est2, '결속 2단계');
    e1.disabled = e2.disabled = !isEsther; cp.querySelector('#cp-esther').classList.toggle('off', !isEsther);
    const mt = cp.querySelector('[data-tg="multi"]'); mt.textContent = (FLAGS.multi ? '💥 ' : '💤 ') + '다중 치명타 : ' + (FLAGS.multi ? 'ON' : 'OFF'); mt.classList.toggle('on', FLAGS.multi);
    const pb = cp.querySelector('[data-cp="pause"]'); pb.textContent = paused ? '⏸️ 실시간 계산 : OFF' : '▶️ 실시간 계산 : ON'; pb.classList.toggle('off', paused);
    cp.querySelector('#cp-dwarn').hidden = ready();
  }
  function openNotice() {
    openModal('la-notice', '📢 Notice', `<div class="la-note"><div><span class="tg a">기본 전제</span><b>데이터는 API 값 기준</b><p>캐릭터 정보는 공식 API 값을 그대로 쓰고, 계산에 쓰는 게임 데이터는 <b>컨트롤 패널 &gt; 데이터 불러오기</b>로 올린 JSON을 사용합니다.</p></div>
      <div><span class="tg b">지원 장비</span><b>장비 범위</b><p>장비는 <b>T4 전율</b> 및 <b>에스더 장비</b>만 지원합니다.</p></div>
      <div><span class="tg b">지원 범위</span><b>보석</b><p><b>6레벨 이상</b> 보석만 계산합니다.</p></div>
      <div><span class="tg c">미지원</span><b>혼돈 코어 옵션</b><p>혼돈 코어 중 <b>서포터 옵션</b>의 코어는 지원하지 않습니다.</p></div>
      <div><span class="tg c">시뮬레이션</span><b>조작 가능한 부분</b><p>아크 패시브는 <b>진화 노드</b>만 조작하며, 깨달음·도약은 고정 데이터를 씁니다. 스킬 트라이포드는 아래 스킬 시뮬레이션에서 바꿔 볼 수 있습니다.</p></div></div>`, 460);
  }

  function makeCollapsible(panel) {
    const heading = panel.querySelector(':scope > .sectiontitle'); if (!heading) return;
    const toggle = document.createElement('button'); toggle.type = 'button'; toggle.className = 'panel-toggle'; toggle.setAttribute('aria-expanded', 'true');
    toggle.appendChild(heading);
    const mark = document.createElement('span'); mark.className = 'collapse-mark'; mark.textContent = '▾'; toggle.appendChild(mark);
    const content = document.createElement('div'); content.className = 'panel-content';
    while (panel.firstChild) content.appendChild(panel.firstChild);
    panel.append(toggle, content); panel.classList.add('collapsible-panel');
    const key = 'la_col_' + panel.id;
    if (store.get(key) === '1') { panel.classList.add('collapsed'); toggle.setAttribute('aria-expanded', 'false'); }
    toggle.addEventListener('click', () => { const c = panel.classList.toggle('collapsed'); toggle.setAttribute('aria-expanded', String(!c)); store.set(key, c ? '1' : '0'); });
  }

  const ACC_RANGE = { '목걸이': [15178, 17857], '귀걸이': [11806, 13785], '반지': [10962, 12897] };
  document.addEventListener('change', e => {
    const t = e.target.closest && e.target.closest('[data-accstat]'); if (!t) return;
    const [i, mk] = t.dataset.accstat.split('|'), eq = (state.equipment || [])[+i]; if (!eq) return;
    const [lo, hi] = ACC_RANGE[eq.slot] || [0, 1e9];
    let v = Math.round(Number(t.value));
    if (!isFinite(v)) v = (eq.base && eq.base[mk]) || lo;
    if (v < lo || v > hi) { toast(`${eq.slot} 스탯은 ${lo.toLocaleString()} ~ ${hi.toLocaleString()} 범위만 지정할 수 있습니다.`, true); v = Math.min(hi, Math.max(lo, v)); }
    eq.base = eq.base || {}; eq.base[mk] = v;
    eq.quality = Math.max(0, Math.min(100, Math.round((v - lo) / (hi - lo) * 100)));
    render();
  });

  document.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
    const el = e.target, tag = el && el.tagName, typ = el && el.type;
    if (tag === 'TEXTAREA' || (tag === 'INPUT' && !['checkbox', 'radio', 'button', 'range'].includes(typ))) return;
    const k = e.key.toLowerCase();
    if (k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
    else if ((k === 'z' && e.shiftKey) || k === 'y') { e.preventDefault(); redo(); }
  });

  function mount() {
    const main = $q('main.main');
    const mk = (id, title, sub, body) => { const e = document.createElement('section'); e.className = 'panel sim-zone'; e.id = id;
      e.innerHTML = `<div class="sectiontitle"><h3>${title}</h3><span class="count">${sub}</span></div>${id === 'evo-panel' ? '<div class="arkpoints-tools"><button type="button" class="btn" data-evp-open>📁 아크패시브 세팅 관리</button></div>' : ''}<div id="${body}"></div>`; return e; };

    const zone = [
      mk('skill-panel', '스킬 시뮬레이션 · 트라이포드', 'API 값으로 시작, 원하는 트라이포드로 바꿔서 계산', 'skill-body'),
      mk('evo-panel', '아크 패시브 · 진화 노드', '깨달음/도약은 고정값, 진화만 시뮬레이션', 'evo-body'),
      mk('cmp-panel', '비교군 대비 변화', '저장한 세팅과 지금 세팅의 차이', 'cmp-body'),
      mk('result-panel', '시뮬레이션 결과', '스킬별 기대 데미지 (1회 사용 기준)', 'result-body'),
      mk('opt-panel', '진화 노드 최적화', '현재 세팅 기준으로 최적 조합 탐색', 'opt-body')
    ];
    let anchor = main.closest('.layout') || main; zone.forEach(z => { anchor.parentNode.insertBefore(z, anchor.nextSibling); anchor = z; });
    zone.forEach(makeCollapsible);
    $q('#skill-body').className = 'ss-wrap';
    document.addEventListener('click', e => { if (e.target.closest('[data-act="open-data"]')) openDataModal(); });
    mountControlPanel();
  }

  mount();
  window.render();

  const _render = render;
  render = function () { _render(); scheduleCalc(); };
  ensureEvo(); ensureTripodSel(); renderEvo(); renderOptBody(); renderSkillSim(); runCalc(); histReset();
  window.LAApp = { undo, redo, histInfo: () => ({ u: HIST.undo.length, r: HIST.redo.length }), saveChar, loadSavedChar, runOpt, runCalc, lastRun: () => lastRun, loadDataFiles, loadFromFiles, applyRaw, openDataModal, DATA: () => DATA, FLAGS };
})();
</script></body></html>
